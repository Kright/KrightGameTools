name: Test
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      # the root aggregate includes every JS module: their test code is compiled, but only the
      # JVM halves execute tests (see jsTestsCompileNotRun in build.sbt), so no Node is needed
      - name: Run tests
        run: sbt test
      # linking needs no JS runtime and catches references to methods missing from the
      # Scala.js javalib (e.g. java.lang.Math.fma) in all code reachable from the test suites
      - name: Link JS test code
        run: sbt matrixJS/Test/fastLinkJS
      - name: Check generated code is in sync with pgaNdCodeGen
        run: sbt "pgaNdCodeGen/runMain me.kright.gametools.pga.codegen.runCodeGenCheck"
